name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the build is reproducible, then build
        run: |
          make repro VERSION="$VERSION"
          make release VERSION="$VERSION"
      - id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: SBOM per binary
        run: |
          for f in dist/aken_* dist/aken-mcp_* dist/aken-devrelay_*; do
            "${{ steps.syft.outputs.cmd }}" scan "file:$f" -o spdx-json > "$f.sbom.spdx.json"
          done
      - name: Checksum every release asset, binaries and SBOMs
        run: make sums VERSION="$VERSION"
      - name: Render collector and MCP install scripts
        run: make render VERSION="$VERSION"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build npm packages
        run: make npm VERSION="$VERSION"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign collector and MCP install scripts (Sigstore keyless)
        run: |
          cosign sign-blob --yes --bundle dist/install.sh.sigstore.json dist/install.sh
          cosign sign-blob --yes --bundle dist/run.sh.sigstore.json dist/run.sh
          cosign sign-blob --yes --bundle dist/install-mcp.sh.sigstore.json dist/install-mcp.sh
      - name: Include scripts in release checksums
        run: make sums VERSION="$VERSION"
      - name: Sign the checksum file (Sigstore keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Attest build provenance (public repository only)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/aken_*
            dist/aken-mcp_*
            dist/aken-devrelay_*
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" --verify-tag --generate-notes \
            --notes-file .github/RELEASE_NOTES_HEADER.md $prerelease dist/*
      - name: Publish npm packages (trusted publishing)
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          for package in dist-npm/akenhq-mcp-*.tgz; do
            npm publish "$package" --access public --tag "$tag"
          done
          for package in dist-npm/aken-mcp-*.tgz; do
            npm publish "$package" --access public --tag "$tag"
          done
