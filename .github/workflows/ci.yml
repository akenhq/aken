name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - run: make vet test depcheck repro
      - run: shellcheck -S style packaging/*.sh
      - run: make test-install
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  install-container:
    name: Install and run once in Debian
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render this branch's scripts with the latest release's binaries
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/akenhq/aken/releases/latest)
          tag=${tag##*/}
          mkdir -p dist
          curl -fsSL "https://github.com/akenhq/aken/releases/download/$tag/SHA256SUMS" -o dist/SHA256SUMS
          bash packaging/render.sh dist "$tag" install > dist/install.sh
          bash packaging/render.sh dist "$tag" once > dist/run.sh
      - name: Run once, check filesystem changes, then install
        shell: bash
        run: |
          set -euo pipefail
          mount="$PWD/dist:/dist:ro"
          prepare='apt-get update && apt-get install -y --no-install-recommends ca-certificates curl util-linux'
          # The scripts arrive through a pipe, as they do from curl.
          once='cat /dist/run.sh | bash -s -- collect --dry-run --file /var/log/dpkg.log'
          docker run --rm --name aken-once -v "$mount" debian:bookworm-slim bash -euo pipefail -c "$prepare; $once"

          trap 'docker rm -f aken-once-diff >/dev/null 2>&1 || true' EXIT
          docker run -d --name aken-once-diff -v "$mount" debian:bookworm-slim sleep infinity
          docker exec aken-once-diff bash -euo pipefail -c "$prepare; mkdir -p /root/.local/state"
          # Exclude dependency setup and parent directory entries from the collector's changes.
          docker diff aken-once-diff | LC_ALL=C sort > "$RUNNER_TEMP/aken-before"
          docker exec aken-once-diff bash -euo pipefail -c "$once"
          docker diff aken-once-diff | LC_ALL=C sort > "$RUNNER_TEMP/aken-after"
          LC_ALL=C comm -13 "$RUNNER_TEMP/aken-before" "$RUNNER_TEMP/aken-after" > "$RUNNER_TEMP/aken-changes"
          while IFS= read -r change; do
            case "${change:2}" in
              /root/.local/state/aken|/root/.local/state/aken/*|/tmp|/tmp/*) ;;
              *) printf 'Unexpected container change: %s\n' "$change" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/aken-changes"
          docker exec aken-once-diff bash -euo pipefail -c '
            # A dry run writes no local copy, so run-once must not create the state directory.
            test ! -e /root/.local/state/aken
            test "$(stat -c "%a" /root)" = 700
            test ! -e /usr/local/bin/aken
            test ! -e /usr/local/libexec/aken
            if getent passwd aken; then exit 1; fi
            test -z "$(find /tmp -maxdepth 1 -name "aken-once.*" -print -quit)"
          '
          # The installed launcher must switch root to the aken user; the collector itself keeps refusing root.
          install='cat /dist/install.sh | bash
            test -x /usr/local/libexec/aken
            head -n 1 /usr/local/bin/aken | grep -qx "#!/bin/sh"
            test "$(stat -c "%U:%G:%a" /var/lib/aken)" = aken:aken:700
            aken version
            aken collect --dry-run --file /var/log/dpkg.log < /dev/null
            if /usr/local/libexec/aken collect --dry-run --file /var/log/dpkg.log < /dev/null; then
              echo "the collector ran as root" >&2
              exit 1
            fi'
          docker run --rm --name aken-install -v "$mount" debian:bookworm-slim bash -euo pipefail -c "$prepare; $install"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .
