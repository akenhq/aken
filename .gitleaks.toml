# gitleaks configuration for CI. The default rules stay in force.
# The only exemption is for the protocol test vectors: deterministic public values in
# exactly the shape spec/token.md defines, matched by the generic-api-key rule. Every
# other rule still applies inside spec/vectors, and every rule applies everywhere else.
[extend]
useDefault = true

[[allowlists]]
description = "Protocol test vectors under spec/vectors are public by design"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^spec/vectors/[a-z0-9-]+\.json$''']
regexTarget = "match"
regexes = [
  '''token": "akn1_[a-z2-7]{52}"''',
  '''[a-z_]+_hex": "[0-9a-f]{32,64}"''',
  '''session_id": "[0-9a-f]{32}"''',
]

[[allowlists]]
description = "Redaction engine tests hold synthetic secret-shaped fixtures: the test table rows and one fake key block"
targetRules = ["generic-api-key", "aws-access-token", "github-pat", "github-fine-grained-pat", "slack-bot-token", "slack-user-token", "stripe-access-token", "gcp-api-key", "sendgrid-api-token", "jwt", "private-key"]
condition = "AND"
paths = ['^internal/redact/redact_test\.go$']
regexTarget = "line"
regexes = [
  '^\s*\{"[a-z0-9-]+", "[^"]{0,64}", "[^"]{0,64}", "[a-z]+"\},$',
  '^\s*\{[`"][^`"]{0,80}[`"], [`"][^`"]{0,80}[`"]\},$',
  '-----BEGIN [A-Z ]*PRIVATE KEY-----\\n[a-z0-9]{1,20}\\n-----END [A-Z ]*PRIVATE KEY-----',
]
